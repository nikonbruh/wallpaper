name: Обновить заставку

on:
  schedule:
    - cron: "17 3 * * *"   # 00:17 по Сан-Паулу
    - cron: "47 5 * * *"   # 02:47, запасной запуск, если первый не случился
  workflow_dispatch:        # ручной запуск кнопкой Run workflow
  push:
    branches: [main]
    paths:
      - "wallpaper.py"
      - "fonts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: wallpaper
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить Pillow
        run: pip install -r requirements.txt

      - name: Нарисовать заставку
        env:
          WALLPAPER_TZ: America/Sao_Paulo
          WALLPAPER_MODEL: iphone_16_pro_max
        run: python wallpaper.py --out wallpaper.png

      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallpaper.png
          if git diff --cached --quiet; then
            echo "Картинка не изменилась"
            exit 0
          fi
          git commit -m "Заставка на $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase
          git push
